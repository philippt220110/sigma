name: SIGMA Weekly Intelligence Agent

on:
  schedule:
    - cron: '0 7 * * 1'
  repository_dispatch:
    types: [trigger-weekly-agent]
  workflow_dispatch:

jobs:
  run-weekly-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v3

      - name: Python einrichten
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install feedparser google-genai

      - name: Weekly Agent mit Gemini AI ausführen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/news_agent.py

      - name: Äußerungen ins Repo committen
        run: |
          git config --global user.name 'SIGMA Strategy Agent'
          git config --global user.email 'agent@sigma-radar.internal'
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "📋 Weekly Strategy Digest: Gemini AI Baseline Evaluation" && git push)
